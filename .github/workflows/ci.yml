# データ整合性の監査・Lint・ビルドを push / PR ごとに実行する。
# どれかが失敗したらマージ・デプロイ前に気づける（Vercel のデプロイ自体は止めない）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: データ監査（翻訳キー・EN日本語残留・画像404・データ欠損・名前規約）
        run: npm run audit

      - name: Lint
        run: npm run lint

      # ビルドは next/font/google で Noto Sans JP / Noto Serif JP を取りに行く。
      # 2026-09-23 に、この取得が失敗して module-not-found でCIだけが落ちた
      # （同じコミットで Vercel のビルドと手元のビルドは成功していた）。
      # 通信の一度きりの失敗で落とさないよう、間を空けて1回だけやり直す。
      # 本物のビルドエラーなら2回とも同じ理由で落ちるので、見逃しにはならない。
      - name: ビルド
        run: |
          npm run build || {
            echo "::warning::ビルドが1回目で失敗した。20秒後にやり直す（フォント取得の失敗を想定）"
            sleep 20
            npm run build
          }
      # 書き出したHTMLを見る検査（35. パッチ一覧に過去の版の本文が無いか）は、ビルドの前の監査では飛ばされる。
      # ビルドのあとにもう一度走らせる。最終更新日の検査は1回目で済んでいるので飛ばす
      - name: 書き出し後の監査
        run: SKIP_FRESHNESS_CHECK=1 node scripts/audit.mjs
